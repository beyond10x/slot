version: '3'

env:
  CARGO_INCREMENTAL: '0'

tasks:
  ui:
    desc: Build the web UI into ui/dist.
    dir: ui
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm build

  ui-check:
    desc: Typecheck and test the web UI.
    dir: ui
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm check

  ui-ux:
    desc: Run the UX gates and the ratchet against the built UI (ui/ux); stopped and failed after 120 s.
    dir: ui
    cmds:
      - |
        node ux/deadline.ts 120 sh -exc '
          ./node_modules/.bin/playwright test
          node ux/ratchet.ts
          node --test --disable-warning=ExperimentalWarning ux/concurrent.e2e.ts'

  ux-round:
    desc: 'Measure a UX round at every size and write its report: task ux-round -- R-nn'
    dir: ui
    env:
      UX_ALL: '1'
    cmds:
      - rm -rf ux/out
      - pnpm exec playwright test || true
      - node ux/round.ts {{.CLI_ARGS}}
      - node ux/ratchet.ts --round

  ui-hero:
    desc: Render the docs hero screenshots from the UX scenarios into website/static/img (needs ui/dist and pngquant).
    dir: ui
    cmds:
      - mkdir -p ../target/hero
      - node ux/hero.ts ../target/hero
      - for f in ui-host-census ui-job-output ui-queue-live-units; do pngquant --quality=70-90 --force --output ../website/static/img/$f.png ../target/hero/$f.png; done

  generate:
    desc: Regenerate the CLI reference, the UI types and the UI pages of the UI spec.
    cmds:
      - cargo run --locked -q -p b10x-slot-docs -- cli-reference
      - cargo run --locked -q -p b10x-slot-docs -- ui-pages
      - cargo run --locked -q -p b10x-slot-docs -- ts-types

  check:
    desc: Run the complete offline repository gate.
    cmds:
      - rustc --version
      - task: ui-check
      - task: ui
      - task: ui-ux
      - task: site
      - task: site-ux
      - task: ui-spec-check
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked
      - cargo run --locked -q -p b10x-slot-docs -- cli-reference --check
      - cargo run --locked -q -p b10x-slot-docs -- ts-types --check
      - cargo run --locked -q -p b10x-slot-docs -- ui-pages --check

  ui-spec-check:
    desc: Validate the ESS spec and its HTTP binding, and check the UI spec (spec/ui/slot.ui.yaml) against both and against the host components it declares.
    cmds:
      - ess specify validate --path spec
      - ess specify http validate --path spec --binding spec/http.yaml
      - ess ui check --path spec/ui/slot.ui.yaml --model spec --hosts spec/ui/slot.hosts

  install:
    desc: Build the UI and install slot into ~/.local/bin.
    deps: [ui]
    cmds:
      - cargo install --locked --root {{.HOME}}/.local --path crates/slot-cli

  service:
    desc: Install and start the systemd user unit.
    deps: [install]
    cmds:
      - install -D -m 0644 contrib/slot.service {{.HOME}}/.config/systemd/user/slot.service
      - systemctl --user daemon-reload
      - systemctl --user enable --now slot.service

  site:
    desc: Build the documentation site.
    dir: website
    cmds:
      - npm ci
      - npm run build

  site-ux:
    desc: Run the docs UX gates and the docs ratchet against the built site (website/ux); stopped and failed after 120 s.
    dir: website
    cmds:
      - ./node_modules/.bin/tsc --noEmit -p ux/tsconfig.json
      - |
        node ../ui/ux/deadline.ts 120 sh -exc '
          node --test --disable-warning=ExperimentalWarning "ux/*.test.ts"
          ./node_modules/.bin/playwright test
          node ux/ratchet.ts'

  site-ux-round:
    desc: 'Measure a docs UX round at every size and write its report: task site-ux-round -- D-nn'
    dir: website
    env:
      UX_ALL: '1'
    cmds:
      - rm -rf ux/out
      - npx playwright test || true
      - node ux/round.ts {{.CLI_ARGS}}
