format: cloudspec-architecture/1
architecture: slot
summary: One shared pool of build slots on a workstation; agent sessions submit build jobs over a unix socket; the daemon queues them on one jobserver and runs them here or on a cloud build node, syncing the tree there over ssh and copying what the job wrote back.
parts:
  workstation:
    block: scope
    placement:
      host: workstation
  build-node:
    block: scope
    placement:
      pool: build-nodes
      lease:
        max_hours: 12
  slot-daemon:
    block: workloads
    kind: process
    in: workstation
    command: ["${home}/.local/bin/slot", serve]
    environment:
      PATH: ${home}/.cargo/bin:${home}/.local/bin:${home}/go/bin:/usr/local/bin:/usr/bin:/bin
    run_as:
      user: deployer
    isolation: none
    priority:
      cpu: background
    stop:
      grace: 2h
      kill: mixed
    upgrade:
      reload:
        signal: HUP
    ports:
    - port: 7411
      bind: loopback
      name: web
      protocol: http
    - name: jobs
      unix: ${runtime_dir}/slot.sock
    - name: jobserver
      fifo: ${home}/.local/state/slot/jobserver.fifo
    checks:
      ready:
        kind: exec
        command: [slot, status]
        port: 7411
    volumes:
    - host_path: ${home}/
      mount: same
      mode: rw
    - host_path: ${home}/.local/state/slot
      mount: same
      mode: rw
    provides:
    - contract: job_runner
      port: jobs
      guarantees:
        exit_code: passed_unchanged
        did_not_run_code: reserved
        run_limit: named_maximum
        queue_order: priority
        placement: remote_only_when_asked
        toolchain_parity: checked_before_remote
    needs:
    - contract: compile_cache
    secrets: []
    egress:
    - name: build-node-ssh
      to: node-daemon
      carries: job
      link: slot-daemon -> node-daemon carries job
  node-daemon:
    block: workloads
    kind: process
    in: build-node
    command: [/usr/local/bin/slot, serve]
    run_as:
      user: build
    prestart:
    - command: [/bin/sh, /usr/local/libexec/slot-node/provision.sh, start-pre, /etc/slot-node/node.conf]
      privileged: true
    limits:
      open_files: 65536
    stop:
      kill: group
    environment:
      HOME: /var/lib/slot-build
      TMPDIR: /srv/slot/tmp
    isolation: none
    upgrade:
      reload:
        signal: HUP
    ports:
    - port: 22
      bind: all
      name: ssh
    checks:
      ready:
        kind: exec
        command: [slot, status]
        port: 22
    volumes:
    - host_path: /var/lib/slot-build
      mount: same
      mode: rw
    - host_path: /srv/slot
      mount: same
      mode: rw
    provides:
    - contract: job_runner
      guarantees:
        exit_code: passed_unchanged
        did_not_run_code: reserved
        run_limit: named_maximum
        queue_order: priority
        placement: local
        toolchain_parity: none
    secrets: []
    egress:
    - name: crates.io:443
  sccache:
    block: workloads
    kind: process
    in: workstation
    command: [sccache, --start-server]
    run_as:
      user: deployer
    isolation: none
    claims:
      cpu_millis: 1000
      memory_mib: 1024
    ports:
    - port: 4226
      bind: loopback
      name: cache
      protocol: tcp
    checks:
      ready:
        kind: exec
        command: [sccache, --show-stats]
        port: 4226
    provides:
    - contract: compile_cache
      port: cache
    secrets: []
    egress: []
  toolchain-refresh:
    block: workloads
    kind: process
    in: workstation
    per: build-node
    restart:
      policy: always
      delay: 10s
      keep_down_on_exit: [2]
    environment_files:
    - path: "${home}/.config/slot/node/toolchains-refresh.env"
      optional: true
    command: [/bin/sh, "${home}/.local/share/slot/toolchains-refresh.sh", "${instance}", "60"]
    run_as:
      user: deployer
    isolation: none
    secrets: []
    egress: []
  agent-session:
    block: actors
    in: workstation
    kind: agent
    external: true
    reach:
      name: agent-session
  operator:
    block: actors
    kind: human
    external: true
    reach:
      name: operator
links:
- from: agent-session
  to: slot-daemon
  carries: job
  to_port: jobs
- from: operator
  to: slot-daemon
  carries: view
  protocol: http
- from: slot-daemon
  to: node-daemon
  carries: job
  protocol: ssh
- from: agent-session
  to: node-daemon
  carries: tree
  protocol: ssh
  data: push
- from: node-daemon
  to: agent-session
  carries: products
  protocol: ssh
  data: pull
- from: slot-daemon
  to: sccache
  carries: compile
  protocol: tcp
parity:
  scopes: [workstation, build-node]
  facts: [rustc_commit, rust_targets, rust_components, go_version, node_version]
border:
- slot-daemon
