format: cloudspec-architecture/1
architecture: slot
summary: One shared pool of build slots on a workstation; agent sessions submit build jobs over a unix socket; the daemon queues them on one jobserver and runs them here or on a cloud build node, syncing the tree there over ssh and copying what the job wrote back.
parts:
  workstation:
    block: scope
    placement:
      host: workstation
  build-node:
    block: scope
    placement:
      pool: build-nodes
      lease:
        max_hours: 12
  slot-daemon:
    block: workloads
    kind: process
    in: workstation
    command: [slot, serve]
    run_as:
      user: deployer
    isolation: none
    upgrade:
      reload:
        signal: HUP
    claims:
      cpu_millis: 500
      memory_mib: 256
    ports:
    - port: 7411
      bind: loopback
      name: web
      protocol: http
    - name: jobs
      unix: /run/slot/slot.sock
    - name: jobserver
      fifo: /var/lib/slot/jobserver.fifo
    checks:
      ready:
        kind: exec
        command: [slot, status]
        port: 7411
    volumes:
    - host_path: /home
      mount: same
      mode: rw
    secrets: []
    egress:
    - name: build-node-ssh
      to: node-daemon
      carries: job
      link: slot-daemon -> node-daemon carries job
  node-daemon:
    block: workloads
    kind: process
    in: build-node
    command: [slot, serve]
    run_as:
      user: deployer
    isolation: none
    upgrade:
      reload:
        signal: HUP
    claims:
      cpu_millis: 32000
      memory_mib: 65536
    ports:
    - port: 22
      bind: all
      name: ssh
    checks:
      ready:
        kind: exec
        command: [slot, status]
        port: 22
    volumes:
    - host_path: /home
      mount: same
      mode: rw
    secrets: []
    egress:
    - name: crates.io:443
  sccache:
    block: workloads
    kind: process
    in: workstation
    command: [sccache, --start-server]
    run_as:
      user: deployer
    isolation: none
    claims:
      cpu_millis: 1000
      memory_mib: 1024
    ports:
    - port: 4226
      bind: loopback
      name: cache
      protocol: tcp
    checks:
      ready:
        kind: exec
        command: [sccache, --show-stats]
        port: 4226
    secrets: []
    egress: []
  toolchain-refresh:
    block: workloads
    kind: agent
    shape: schedule
    calendar: "*:*:00"
    in: workstation
    package:
      agent:
        digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
        document: toolchains-refresh
      runtime:
        image: slot@sha256:1111111111111111111111111111111111111111111111111111111111111111
  state:
    block: resources
    kind: volume
    per: slot-daemon
    access: read_write_once
    size: 10Gi
    sharing: exclusive
    mount: /var/lib/slot
  mirrors:
    block: resources
    kind: volume
    per: node-daemon
    access: read_write_once
    size: 500Gi
    sharing: exclusive
    mount: /srv/slot
  agent-session:
    block: actors
    in: workstation
    kind: agent
    external: true
    reach:
      name: agent-session
  operator:
    block: actors
    kind: human
    external: true
    reach:
      name: operator
links:
- from: agent-session
  to: slot-daemon
  carries: job
  to_port: jobs
- from: operator
  to: slot-daemon
  carries: view
  protocol: http
- from: slot-daemon
  to: node-daemon
  carries: job
  protocol: ssh
- from: agent-session
  to: node-daemon
  carries: tree
  protocol: ssh
  data: push
- from: node-daemon
  to: agent-session
  carries: products
  protocol: ssh
  data: pull
- from: slot-daemon
  to: sccache
  carries: compile
  protocol: tcp
parity:
  scopes: [workstation, build-node]
  facts: [rustc_commit, rust_targets, rust_components, go_version, node_version]
border:
- slot-daemon
