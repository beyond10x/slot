name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@44f4a083349f064ebb2246fd4d66f9862729cd70
    secrets:
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
      B10X_GATES_POLICY_GZ: ${{ secrets.B10X_GATES_POLICY_GZ }}
