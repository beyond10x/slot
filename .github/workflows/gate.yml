name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the browser for the UX gates
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps --only-shell chromium && sudo apt-get install -y fonts-dejavu-core
      - run: task check
