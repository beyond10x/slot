name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the rustc pinned in rust-toolchain.toml
        id: rustc
        run: sed -n 's/^channel = "\(.*\)"$/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: ${{ steps.rustc.outputs.channel }}
          components: rustfmt, clippy
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the ess release spec/ess-inputs.yaml requires, for the UI-spec check
        run: sh .github/scripts/install-ess.sh "$RUNNER_TEMP/ess" >> "$GITHUB_PATH"
      - name: Install the browser for the UX gates
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps --only-shell chromium && sudo apt-get install -y fonts-dejavu-core
      - name: Run the repository gate
        run: task check
      - name: The tag, the workspace and the changelog agree
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "b10x-slot-cli") | .version')
          test "$version" = "$GITHUB_REF_NAME" || { echo "::error::workspace is $version, tag is $GITHUB_REF_NAME" >&2; exit 1; }
          grep -q "^## ${GITHUB_REF_NAME} — " CHANGELOG.md || { echo "::error::CHANGELOG.md has no dated ${GITHUB_REF_NAME} section" >&2; exit 1; }

  package:
    name: Package ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture builds on a runner of its own kind, where the binary runs.
          # Ubuntu 22.04 keeps the glibc floor lower than `ubuntu-latest` for downloaded binaries.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # Static binaries, for a host with an older glibc or none. rustc links them with the
          # musl it ships for the target: the runner needs no musl package.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the rustc pinned in rust-toolchain.toml
        id: rustc
        run: sed -n 's/^channel = "\(.*\)"$/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: ${{ steps.rustc.outputs.channel }}
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Build the web UI, then build and smoke-test slot
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          (cd ui && pnpm install --frozen-lockfile && pnpm build)
          # The binary names no path of the runner's home (source paths of panic locations).
          # rustc applies the last remap that matches, so the checkout's comes last.
          export RUSTFLAGS="--remap-path-prefix=$HOME=/cargo-home --remap-path-prefix=$PWD=/src"
          case ${CARGO_HOME:-} in
            "" | "$HOME" | "$HOME"/*) ;;
            *) RUSTFLAGS="--remap-path-prefix=$CARGO_HOME=/cargo $RUSTFLAGS" ;;
          esac
          cargo build --locked --release --bin slot --target "$TARGET"
          bin="target/$TARGET/release/slot"
          sh .github/scripts/no-home-path.sh "$bin" || { echo "::error::the $TARGET binary names a path of the build machine's home" >&2; exit 1; }
          printed=$("$bin" --version | awk '{print $NF}')
          if [ "$printed" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the built binary reports $printed, but the release tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Prove the musl binary is static and runs in Alpine
        if: endsWith(matrix.target, '-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          # The image index of Alpine 3.23: one digest, an image for each architecture.
          ALPINE: docker.io/library/alpine@sha256:469c9ea410b9215eaee7976ba6c0639039b444be8e5d638f7abbada189971eb2
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/slot"
          sh .github/scripts/static-binary.sh "$bin"
          printed=$(docker run --rm --network none --volume "$PWD/$bin:/slot:ro" "$ALPINE" /slot --version | awk '{print $NF}')
          if [ "$printed" != "$GITHUB_REF_NAME" ]; then
            echo "::error::in Alpine the $TARGET binary reports '$printed', but the release tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Package slot
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="slot-$GITHUB_REF_NAME-$TARGET"
          mkdir -p "dist/$package"
          cp "target/$TARGET/release/slot" LICENSE README.md "dist/$package/"
          mkdir -p "dist/$package/contrib"
          cp -R contrib/slot-wrapper contrib/slot-shim contrib/tree-cd.sh contrib/env-names.sh \
            contrib/refusal-log.sh contrib/rustc-gate contrib/slot.service \
            contrib/slot-toolchains-refresh@.service contrib/node "dist/$package/contrib/"
          rm -f "dist/$package/contrib/node/test.sh"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  bundle:
    name: Bundle release assets
    needs: [gate, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify archives, write checksums and notes
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -f "dist/slot-$GITHUB_REF_NAME-$target.tar.gz" || { echo "::error::missing slot-$GITHUB_REF_NAME-$target.tar.gz" >&2; exit 1; }
          done
          (cd dist && sha256sum slot-*.tar.gz > SHA256SUMS && sha256sum --check SHA256SUMS && cat SHA256SUMS)
          awk -v heading="## ${GITHUB_REF_NAME} — " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { lines[++n] = $0 }
            END {
              first = 1; while (first <= n && lines[first] ~ /^[[:space:]]*$/) first++
              last = n; while (last >= first && lines[last] ~ /^[[:space:]]*$/) last--
              for (i = first; i <= last; i++) print lines[i]
            }' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || { echo "::error::CHANGELOG.md has no ${GITHUB_REF_NAME} notes" >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slot-${{ github.ref_name }}-release
          path: dist/*
          if-no-files-found: error
